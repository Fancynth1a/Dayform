<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafa"><title>Dayform — Your study space</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#171717;background:#f7f7f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #555;outline-offset:2px}.shell{max-width:1100px;margin:auto;min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#fff;border-right:1px solid #e9e9e9;padding:32px 20px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:800;letter-spacing:-1.5px;margin:0 0 6px}.tagline{font-size:12px;color:#888;margin-bottom:44px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;text-align:left;border-radius:12px;padding:14px;color:#777}.nav button.active{background:#171717;color:white}.main{padding:38px 42px 110px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#888;font-weight:700}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1.5px;margin:12px 0 8px}h2{font-size:18px;letter-spacing:-.4px;margin:0}.muted{color:#888;font-size:13px}.panel{background:white;border:1px solid #eaeaea;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.stack{display:grid;gap:16px}.progress{height:8px;border-radius:20px;background:#ededed;overflow:hidden;margin-top:18px}.progress>div{height:100%;background:#171717;transition:width .2s}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.primary{border:0;background:#171717;color:#fff;border-radius:10px;padding:11px 15px;font-weight:600}.secondary{border:1px solid #ddd;background:#fff;color:#222;border-radius:10px;padding:9px 12px}.small{padding:6px 9px;font-size:12px}.task{display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0f0f0;padding:13px 0}.task:last-child{border-bottom:0}.task input[type=checkbox]{width:18px;height:18px;accent-color:#171717;flex:none}.task-body{flex:1;min-width:0}.task.done .task-name{text-decoration:line-through;color:#aaa}.task-name{font-size:14px;overflow-wrap:anywhere}.meta{font-size:11px;color:#888;margin-top:4px}.ghost{border:0;background:transparent;color:#888;padding:6px}.pill{font-size:11px;border-radius:20px;padding:5px 8px;background:#f1f1f1;white-space:nowrap}.danger{color:#a33}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.empty{color:#999;font-size:13px;padding:18px 0}.form{display:grid;gap:12px;margin-top:16px}.field{display:grid;gap:5px;font-size:12px;color:#555}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:white;color:#171717}.field textarea{min-height:80px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.section{margin-top:24px}.bottom{display:none}.stats{font-size:30px;font-weight:750;letter-spacing:-1px}.note{font-size:12px;color:#777;line-height:1.6}.daytabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.daytabs button{border:1px solid #ddd;background:#fff;padding:8px 10px;border-radius:10px}.daytabs button.active{background:#171717;color:white}.journal{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:10px 18px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:25px 18px 105px}.grid{grid-template-columns:1fr}.panel{padding:18px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#fff;border-top:1px solid #eaeaea;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:transparent;color:#999;font-size:11px;padding:8px 12px}.bottom button.active{color:#111;font-weight:800}.formrow{grid-template-columns:1fr 1fr}.top .muted{font-size:11px}}

/* Dayform 2.1: mobile-first refinements */
html{scroll-behavior:smooth}body{overflow-x:hidden}button,input,select,textarea{touch-action:manipulation}button{min-height:40px}.task .ghost{min-width:42px;min-height:42px}.task input[type=checkbox]{width:22px;height:22px}.task{min-width:0}.task-body{min-width:0}.task-name{line-height:1.45}.pill{white-space:normal;text-align:center}.panel{min-width:0}.main{min-width:0}
@media(max-width:760px){.main{padding:22px 14px calc(112px + env(safe-area-inset-bottom))}.panel{padding:16px;border-radius:16px}.section{margin-top:16px}.grid,.stack{gap:12px}h1{font-size:30px;line-height:1.15}.top{align-items:flex-start}.top .eyebrow{max-width:60%;line-height:1.5}.bottom{gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px rgba(0,0,0,.04)}.bottom button{flex:1;min-height:52px;padding:9px 2px;border-radius:10px;font-size:12px}.bottom button.active{background:#f2f2f2}.formrow{grid-template-columns:1fr}.field input,.field select,.field textarea{font-size:16px;min-height:46px}.task{gap:7px}.task .ghost{font-size:12px;padding:6px}.task-name{font-size:14px}.stats{font-size:26px}.daytabs{display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.daytabs button{flex:none;min-height:44px}.toast{bottom:calc(90px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}}
@media(max-width:370px){.main{padding-left:10px;padding-right:10px}.panel{padding:13px}.task .ghost{min-width:36px}.between{gap:6px}}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><div class="shell"><aside class="side"><div class="brand">dayform.</div><div class="tagline">Your personal study space</div><nav class="nav" id="sideNav"></nav><p class="note" style="margin-top:55px">Designed for real student life.<br>你的数据保存在当前浏览器。</p></aside><main class="main"><div class="top"><span class="eyebrow">DAYFORM / PERSONAL WORKSPACE</span><span class="muted" id="todayDate"></span></div><div id="view"></div></main></div><nav class="bottom" id="bottomNav"></nav><div class="toast" id="toast" role="status"></div><script>
'use strict';const KEY='dayform-v2-data';const days=['周日','周一','周二','周三','周四','周五','周六'];const navs=[['home','⌂','Home'],['plan','▦','Plan'],['goals','◎','Goals'],['journal','▤','Journal']];const iso=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({tasks:[],classes:[],goals:[],journals:[]});let data;try{const raw=JSON.parse(localStorage.getItem(KEY));data={...initial(),...raw};for(const k of Object.keys(initial()))if(!Array.isArray(data[k]))data[k]=[]}catch{data=initial()}let page='home',editingTask=null,selectedDay=new Date().getDay();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('无法保存：请检查浏览器存储权限')}};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2100)}function fmt(s){if(!s)return '无日期';const [y,m,d]=s.split('-');return `${Number(m)}月${Number(d)}日`}function remaining(s){if(!s)return null;const a=new Date(s+'T12:00:00'),b=new Date(iso()+'T12:00:00');return Math.round((a-b)/86400000)}function dueText(s){const n=remaining(s);return n===null?'无截止日期':n<0?`已逾期 ${-n} 天`:n===0?'今天截止':n===1?'明天截止':`还有 ${n} 天`}function nav(){const html=navs.map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${icon} &nbsp; ${label}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('bottomNav').innerHTML=html}function taskList(tasks){if(!tasks.length)return '<div class="empty">这里还没有任务，添加第一项吧。</div>';return tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''} aria-label="完成任务 ${safe(t.name)}"><div class="task-body"><div class="task-name">${safe(t.name)}</div><div class="meta">${safe(t.course||'个人任务')} · ${safe(dueText(t.due))} · ${safe(t.priority||'普通')}</div></div><button class="ghost" data-edit="${t.id}" aria-label="编辑">编辑</button><button class="ghost danger" data-delete="${t.id}" aria-label="删除">×</button></div>`).join('')}function taskForm(){const t=data.tasks.find(x=>x.id===editingTask)||{};return `<form id="taskForm" class="form"><label class="field">任务名称<input name="name" maxlength="100" required placeholder="例如：完成英语演讲 PPT" value="${safe(t.name||'')}"></label><div class="formrow"><label class="field">所属课程<input name="course" maxlength="50" placeholder="例如：英美文学" value="${safe(t.course||'')}"></label><label class="field">截止日期<input type="date" name="due" value="${safe(t.due||iso())}"></label></div><label class="field">优先级<select name="priority"><option ${t.priority==='普通'?'selected':''}>普通</option><option ${t.priority==='重要'?'selected':''}>重要</option><option ${t.priority==='紧急'?'selected':''}>紧急</option></select></label><div class="between"><button class="primary" type="submit">${editingTask?'保存修改':'添加任务'}</button><button type="button" class="secondary" data-close-form>取消</button></div></form>`}function home(){const today=iso();const current=data.tasks.filter(t=>!t.done&&(!t.due||t.due<=today));const todayAll=data.tasks.filter(t=>!t.due||t.due<=today);const completed=todayAll.filter(t=>t.done).length;const pct=todayAll.length?Math.round(completed/todayAll.length*100):0;const classes=data.classes.filter(c=>Number(c.day)===new Date().getDay()).sort((a,b)=>a.time.localeCompare(b.time));const upcoming=data.tasks.filter(t=>!t.done&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);return `<h1>Make today count.</h1><p class="muted">把今天需要做的事，安排得清清楚楚。</p><section class="panel section"><div class="between"><div><div class="eyebrow">TODAY'S PROGRESS</div><div class="stats" style="margin-top:9px">${completed} <span class="muted">/ ${todayAll.length} 项完成</span></div></div><div class="stats">${pct}%</div></div><div class="progress"><div style="width:${pct}%"></div></div></section><div class="grid section"><div class="stack"><section class="panel"><div class="between"><h2>Today's Tasks</h2><button class="primary small" data-open-form>+ 新任务</button></div><div id="taskFormSlot"></div>${taskList([...current,...todayAll.filter(t=>t.done)])}<p class="note">首页显示今天截止、已逾期或未设置日期的任务。其他任务在 Plan 页面查看。</p></section><section class="panel"><div class="between"><h2>Upcoming Deadlines</h2><button class="secondary small" data-page="plan">查看全部</button></div>${upcoming.length?upcoming.map(t=>`<div class="item between"><div><b style="font-size:13px">${safe(t.name)}</b><div class="meta">${safe(t.course||'个人任务')} · ${fmt(t.due)}</div></div><span class="pill">${safe(dueText(t.due))}</span></div>`).join(''):'<div class="empty">暂时没有待截止任务。</div>'}</section></div><div class="stack"><section class="panel"><div class="between"><h2>Today's Classes</h2><button class="secondary small" data-page="plan">课程表</button></div>${classes.length?classes.map(c=>`<div class="item"><b style="font-size:14px">${safe(c.name)}</b><div class="meta">${safe(c.time)} · ${safe(c.place||'未填写教室')}</div></div>`).join(''):'<div class="empty">今天没有录入课程。</div>'}</section><section class="panel"><div class="between"><h2>Goals</h2><button class="secondary small" data-page="goals">查看目标</button></div>${data.goals.length?data.goals.slice(0,3).map(g=>`<div class="item"><b style="font-size:13px">${safe(g.name)}</b><div class="meta">${safe(dueText(g.due))}</div></div>`).join(''):'<div class="empty">给自己设定一个小目标吧。</div>'}</section></div></div>`}function plan(){const sorted=[...data.tasks].sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999'));return `<h1>Plan your week.</h1><p class="muted">课程表与任务安排，放在同一个地方。</p><div class="grid section"><section class="panel"><div class="between"><h2>All Tasks</h2><button class="primary small" data-open-form>+ 新任务</button></div><div id="taskFormSlot"></div>${taskList(sorted)}</section><section class="panel"><h2>Weekly Classes</h2><div class="daytabs">${days.map((d,i)=>`<button class="${selectedDay===i?'active':''}" data-day="${i}">${d}</button>`).join('')}</div>${data.classes.filter(c=>Number(c.day)===selectedDay).sort((a,b)=>a.time.localeCompare(b.time)).map(c=>`<div class="item between"><div><b>${safe(c.name)}</b><div class="meta">${safe(c.time)} · ${safe(c.place||'未填写教室')}</div></div><button class="ghost danger" data-delete-class="${c.id}">删除</button></div>`).join('')||'<div class="empty">这一天还没有课程。</div>'}<form class="form" id="classForm"><label class="field">课程名称<input name="name" required maxlength="60" placeholder="例如：英美文学"></label><div class="formrow"><label class="field">星期<select name="day">${days.map((d,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">上课时间<input type="time" name="time" required value="09:00"></label></div><label class="field">教室（选填）<input name="place" maxlength="50" placeholder="例如：A301"></label><button class="primary" type="submit">添加课程</button></form></section></div>`}function goals(){return `<h1>Keep your goals in sight.</h1><p class="muted">记录考试、学期目标和重要里程碑。</p><div class="grid section"><section class="panel"><h2>My Goals</h2>${data.goals.map(g=>`<div class="item between"><div><b>${safe(g.name)}</b><div class="meta">${fmt(g.due)} · ${safe(dueText(g.due))}</div></div><button class="ghost danger" data-delete-goal="${g.id}">删除</button></div>`).join('')||'<div class="empty">还没有目标。</div>'}</section><section class="panel"><h2>New Goal</h2><form class="form" id="goalForm"><label class="field">目标名称<input name="name" maxlength="100" required placeholder="例如：通过期末考试"></label><label class="field">目标日期<input type="date" name="due" required value="${iso()}"></label><button class="primary" type="submit">添加目标</button></form></section></div>`}function journal(){const entries=[...data.journals].sort((a,b)=>b.date.localeCompare(a.date));return `<h1>Reflect & grow.</h1><p class="muted">写下今天的学习收获，记录自己的成长。</p><div class="grid section"><section class="panel"><h2>New Entry</h2><form class="form" id="journalForm"><label class="field">日期<input type="date" name="date" required value="${iso()}"></label><label class="field">今天学到了什么？<textarea name="content" maxlength="2000" required placeholder="记录一点进步，或者一个值得反思的问题……"></textarea></label><button class="primary" type="submit">保存学习记录</button></form></section><section class="panel"><h2>My Journal</h2>${entries.map(e=>`<div class="item"><div class="between"><b style="font-size:13px">${fmt(e.date)}</b><button class="ghost danger" data-delete-journal="${e.id}">删除</button></div><p class="journal">${safe(e.content)}</p></div>`).join('')||'<div class="empty">还没有学习记录。</div>'}</section></div>`}function render(){nav();document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());document.getElementById('view').innerHTML=({home,plan,goals,journal}[page])();}function showForm(){document.getElementById('taskFormSlot').innerHTML=taskForm();document.querySelector('#taskForm input[name=name]').focus()}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){page=d.page;editingTask=null;render();window.scrollTo(0,0)}else if('openForm'in d){editingTask=null;showForm()}else if('closeForm'in d){editingTask=null;document.getElementById('taskFormSlot').innerHTML=''}else if(d.edit){editingTask=d.edit;showForm()}else if(d.delete){if(confirm('确定删除这项任务吗？')){data.tasks=data.tasks.filter(t=>t.id!==d.delete);save();render()}}else if(d.day!==undefined){selectedDay=Number(d.day);render()}else if(d.deleteClass){data.classes=data.classes.filter(c=>c.id!==d.deleteClass);save();render()}else if(d.deleteGoal){data.goals=data.goals.filter(g=>g.id!==d.deleteGoal);save();render()}else if(d.deleteJournal){data.journals=data.journals.filter(j=>j.id!==d.deleteJournal);save();render()}});document.addEventListener('change',e=>{if(e.target.dataset.check){const t=data.tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();render()}}});document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='taskForm'){const name=String(fd.get('name')).trim();if(!name)return;const item={name,course:String(fd.get('course')).trim(),due:String(fd.get('due')),priority:String(fd.get('priority'))};if(editingTask){const t=data.tasks.find(x=>x.id===editingTask);if(t)Object.assign(t,item)}else data.tasks.push({id:uid(),done:false,...item});editingTask=null;save();render();toast('任务已保存')}else if(f.id==='classForm'){data.classes.push({id:uid(),name:String(fd.get('name')).trim(),day:Number(fd.get('day')),time:String(fd.get('time')),place:String(fd.get('place')).trim()});selectedDay=Number(fd.get('day'));save();render();toast('课程已添加')}else if(f.id==='goalForm'){data.goals.push({id:uid(),name:String(fd.get('name')).trim(),due:String(fd.get('due'))});save();render();toast('目标已添加')}else if(f.id==='journalForm'){data.journals.push({id:uid(),date:String(fd.get('date')),content:String(fd.get('content')).trim()});save();render();toast('记录已保存')}});render();if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
